<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IOI GHG Tracker — Log in</title><link rel="stylesheet" href="style.css" /></head>
<body>
<header class="topbar"><div class="brand">IOI GHG Tracker</div></header>
<main style="max-width:420px;">
  <div class="card" style="margin-top:40px;">
    <h2>Staff log in</h2>
    <p class="hint">Use the username and password Daniel gave you. Forgotten it? Ask Daniel to reset it.</p>
    <form id="login-form">
      <label>Username<input id="u" autocomplete="username" required autofocus /></label>
      <label>Password<input id="p" type="password" autocomplete="current-password" required /></label>
      <button type="submit">Log in</button>
    </form>
    <div id="msg" class="result"></div>
  </div>
</main>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: document.getElementById("u").value, password: document.getElementById("p").value }) });
  const d = await r.json();
  if (r.ok) location.href = "/"; else document.getElementById("msg").innerHTML = `<div class="err">${d.error}</div>`;
});
</script></body></html>
